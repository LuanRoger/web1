<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messi X Cristiano Ronaldo</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/compare-section.css" />
    <link rel="stylesheet" href="./css/about-project.css" />
    <link rel="stylesheet" href="./css/cronograma.css" />
    <link rel="stylesheet" href="./css/countdown.css" />
    <link rel="stylesheet" href="./css/subscription.css" />
    <link rel="stylesheet" href="./css/footer.css" />
    <link rel="stylesheet" href="./css/event-details.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <section class="player-comparison gothic-font"></section>
        <h1 class="event-title fancy-font">The Last Dance</h1>
      </div>
      <nav class="nav-container">
        <ul class="nav-list gothic-font"></ul>
      </nav>
    </header>
    <main>
      <article>
        <section id="messi" class="messi-section"></section>
        <section id="cr7" class="cr7-section"></section>
      </article>
      <section id="about" class="about-section">
        <h1 class="about-title gothic-font">Sobre o evento</h1>
        <p class="about-text"></p>
        <p></p>
        <p></p>
        <p></p>
        <p class="underline-text"></p>
      </section>
      <section id="cron" class="cronograma-section">
        <h1 class="gothic-font">Cronograma do Evento</h1>
        <table class="cronograma-table"></table>
      </section>
      <section id="countdown" class="countdown-section">
        <h1 class="countdown-title gothic-font">Contagem Regressiva</h1>
        <div class="countdown-container"></div>
      </section>
      <section id="subscription" class="subscription-section">
        <h1 class="subscription-title gothic-font">Inscreva-se no Evento</h1>
        <form id="subscriptionForm" class="subscription-form"></form>
      </section>
      <footer class="footer-container">
        <aside class="social-media-container"></aside>
        <aside></aside>
      </footer>
    </main>
    <div id="eventDetailsModal" class="modal-overlay">
      <div class="event-details-modal">
        <div class="modal-header">
          <h2 id="modalEventName" class="modal-title">The Last Dance</h2>
          <button class="close-modal">&times;</button>
        </div>
        <div class="modal-content"></div>
      </div>
    </div>

    <script src="./js/models/event-model.js"></script>
    <script src="./js/models/form-model.js"></script>
    <script src="./js/models/countdown-model.js"></script>
    <script src="./js/views/views.js"></script>
    <script src="./js/controllers/about-controller.js"></script>
    <script src="./js/controllers/countdown-controller.js"></script>
    <script src="./js/controllers/footer-controller.js"></script>
    <script src="./js/controllers/form-controller.js"></script>
    <script src="./js/controllers/header-controller.js"></script>
    <script src="./js/controllers/modal-controller.js"></script>
    <script src="./js/controllers/player-controller.js"></script>
    <script src="./js/controllers/schedule-controller.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
